name: 缺陷 / Bug
description: 提交可复现的问题并关联需求与回归证据
title: "[缺陷] "
body:
  - type: input
    id: requirement
    attributes:
      label: 关联需求与验收标准
      placeholder: "#123 / AC-07"
    validations:
      required: true
  - type: dropdown
    id: severity
    attributes:
      label: 级别
      options:
        - P0 - 阻断必需能力或数据口径错误，阻止验收
        - P1 - 主要功能受影响，存在明确替代路径
        - P2 - 次要体验或文档问题
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: 环境与复现步骤
      description: 记录提交、Node 版本、真实或演示模式、国家、商店及最少步骤；不要包含密码或密钥。
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: 期望与实际结果
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: 证据与错误信息
      description: 添加截图、命令结果或去敏日志，以及报告链接。
  - type: textarea
    id: verification
    attributes:
      label: 修复与回归记录
      value: |
        负责人：CTO
        修复 PR：
        Alex 回归步骤与结果：
        PM 验收影响：
